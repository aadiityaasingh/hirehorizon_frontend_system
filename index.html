<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HireHorizon - Find Your Dream Job</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #ffffff;">
    <div id="root">
      <!-- Instant Pre-render Loader (Zero Latency - prevents white screen on initial load) -->
      <div id="initial-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
          <div style="width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #2563eb, #1d4ed8); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect width="20" height="14" x="2" y="7" rx="2" ry="2"/>
              <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
            </svg>
          </div>
          <span style="font-size: 26px; font-weight: 800; color: #111827; letter-spacing: -0.5px;">Hire<span style="color: #2563eb;">HoriZon</span></span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="width: 22px; height: 22px; border: 3px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: hh-spin 0.7s linear infinite;"></div>
          <span style="font-size: 13px; font-weight: 500; color: #64748b;">Loading HireHoriZon...</span>
        </div>
        <style>
          @keyframes hh-spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
