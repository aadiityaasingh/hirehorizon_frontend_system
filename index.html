<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/HireHoriZonlogo.png" />
    <link rel="apple-touch-icon" href="/HireHoriZonlogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HireHorizon - Find Your Dream Job</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #ffffff;">
    <div id="root">
      <!-- Instant Pre-render Loader (Zero Latency - displays official brand logo instantly) -->
      <div id="initial-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
          <img src="/HireHoriZonlogo.png" alt="HireHoriZon" style="width: 46px; height: 46px; object-fit: contain;" />
          <span style="font-size: 26px; font-weight: 800; color: #111827; letter-spacing: -0.5px;">Hire<span style="color: #2563eb;">HoriZon</span></span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="width: 22px; height: 22px; border: 3px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: hh-spin 0.7s linear infinite;"></div>
          <span style="font-size: 13px; font-weight: 500; color: #64748b;">Loading HireHoriZon...</span>
        </div>
        <style>
          @keyframes hh-spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
